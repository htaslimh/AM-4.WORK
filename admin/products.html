<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk - AMERTALOKA Admin</title>
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/admin.css">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--color-gray-50);
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="admin-sidebar-header">
                <a href="../index.html" class="admin-logo">
                    <div class="admin-logo-icon">A</div>
                    <span>AMERTALOKA</span>
                </a>
            </div>
            
            <nav class="admin-nav">
                <div class="admin-nav-section">
                    <div class="admin-nav-title">Menu Utama</div>
                    <a href="index.html" class="admin-nav-item">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                        </svg>
                        Dashboard
                    </a>
                    <a href="products.html" class="admin-nav-item active">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                        </svg>
                        Produk
                    </a>
                    <a href="blog.html" class="admin-nav-item">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
                        </svg>
                        Blog
                    </a>
                    <a href="messages.html" class="admin-nav-item">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                        Pesan
                    </a>
                </div>
                
                <div class="admin-nav-section">
                    <div class="admin-nav-title">Pengaturan</div>
                    <a href="#" class="admin-nav-item" onclick="handleLogout()">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                        Keluar
                    </a>
                </div>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="admin-main">
            <!-- Header -->
            <header class="admin-header">
                <div class="admin-header-left">
                    <div class="admin-breadcrumb">
                        <a href="index.html">Admin</a>
                        <span class="admin-breadcrumb-separator">/</span>
                        <span class="admin-breadcrumb-current">Produk</span>
                    </div>
                </div>
                
                <div class="admin-header-right">
                    <div class="admin-user-menu">
                        <div class="admin-user-avatar">A</div>
                        <span class="admin-user-name">Admin</span>
                    </div>
                </div>
            </header>
            
            <!-- Content -->
            <div class="admin-content">
                <div class="admin-page-header" style="display: flex; align-items: center; justify-content: space-between;">
                    <div>
                        <h1 class="admin-page-title">Manajemen Produk</h1>
                        <p class="admin-page-description">Kelola semua produk pertanian AMERTALOKA.</p>
                    </div>
                    <div style="background: var(--color-gray-100); padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.875rem; color: var(--color-gray-600);">
                        Mode baca saja (data dari JSON)
                    </div>
                </div>
                
                <!-- Filters -->
                <div class="admin-card" style="margin-bottom: 1.5rem;">
                    <div class="admin-card-body" style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                        <div style="flex: 1; min-width: 200px;">
                            <input type="text" class="admin-form-input" placeholder="Cari produk..." id="searchInput" oninput="filterProducts()">
                        </div>
                        <select class="admin-form-input" style="width: auto;" id="categoryFilter" onchange="filterProducts()">
                            <option value="">Semua Kategori</option>
                            <option value="Benih">Benih</option>
                            <option value="Pupuk">Pupuk</option>
                            <option value="Pestisida">Pestisida</option>
                            <option value="Alat Pertanian">Alat Pertanian</option>
                        </select>
                        <select class="admin-form-input" style="width: auto;" id="statusFilter" onchange="filterProducts()">
                            <option value="">Semua Status</option>
                            <option value="available">Tersedia</option>
                            <option value="preorder">Pre-order</option>
                        </select>
                    </div>
                </div>
                
                <!-- Products Table -->
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h3 class="admin-card-title">Daftar Produk</h3>
                        <span class="admin-badge info" id="productCount">0 Produk</span>
                    </div>
                    <div class="admin-table-container">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Produk</th>
                                    <th>Kategori</th>
                                    <th>Harga</th>
                                    <th>Status</th>
                                    <th>Fitur Unggulan</th>
                                </tr>
                            </thead>
                            <tbody id="productsTableBody">
                                <!-- Filled by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        // Check authentication
        if (localStorage.getItem('amertaloka_admin_logged_in') !== 'true') {
            window.location.href = 'login.html';
        }
        
        // Logout function
        function handleLogout() {
            localStorage.removeItem('amertaloka_admin_logged_in');
            localStorage.removeItem('amertaloka_admin_user');
            window.location.href = 'login.html';
        }
        
        let allProducts = [];
        
        // Load products
        async function loadProducts() {
            try {
                const res = await fetch('../data/products.json');
                const data = await res.json();
                allProducts = data.products || [];
                renderProducts(allProducts);
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }
        
        // Render products table
        function renderProducts(products) {
            document.getElementById('productCount').textContent = `${products.length} Produk`;
            
            const tbody = document.getElementById('productsTableBody');
            
            if (products.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5">
                            <div class="admin-empty-state">
                                <div class="admin-empty-icon">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                                    </svg>
                                </div>
                                <h4 class="admin-empty-title">Tidak ada produk</h4>
                                <p class="admin-empty-text">Tidak ada produk yang sesuai dengan filter Anda.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = products.map(product => `
                <tr>
                    <td>
                        <div class="admin-table-product">
                            <div class="admin-table-image" style="background: linear-gradient(135deg, var(--color-primary-50), var(--color-secondary-50)); display: flex; align-items: center; justify-content: center; color: var(--color-primary); font-weight: 600;">
                                ${product.name.substring(0, 2).toUpperCase()}
                            </div>
                            <div class="admin-table-product-info">
                                <h4>${product.name}</h4>
                                <span>${product.tagline || ''}</span>
                            </div>
                        </div>
                    </td>
                    <td><span class="admin-badge info">${product.category}</span></td>
                    <td style="font-weight: 500;">${product.price}</td>
                    <td>
                        <span class="admin-badge ${product.status === 'available' ? 'success' : 'warning'}">
                            ${product.status === 'available' ? 'Tersedia' : 'Pre-order'}
                        </span>
                    </td>
                    <td>
                        <div style="display: flex; flex-wrap: wrap; gap: 0.25rem;">
                            ${(product.features || []).slice(0, 2).map(f => `<span style="font-size: 0.75rem; color: var(--color-gray-500);">${f}</span>`).join(', ')}
                        </div>
                    </td>
                </tr>
            `).join('');
        }
        
        // Filter products
        function filterProducts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const status = document.getElementById('statusFilter').value;
            
            let filtered = allProducts;
            
            if (search) {
                filtered = filtered.filter(p => 
                    p.name.toLowerCase().includes(search) || 
                    (p.description && p.description.toLowerCase().includes(search))
                );
            }
            
            if (category) {
                filtered = filtered.filter(p => p.category === category);
            }
            
            if (status) {
                filtered = filtered.filter(p => p.status === status);
            }
            
            renderProducts(filtered);
        }
        
        // Initialize
        loadProducts();
    </script>
</body>
</html>
