<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - AMERTALOKA</title>
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/admin.css">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--color-gray-50);
        }
    </style>
</head>
<body>
    <div class="admin-login-page">
        <div class="admin-login-card">
            <div class="admin-login-header">
                <div class="admin-login-logo">A</div>
                <h1 class="admin-login-title">AMERTALOKA Admin</h1>
                <p class="admin-login-subtitle">Masuk ke dashboard admin Anda</p>
            </div>
            
            <div class="admin-login-error" id="loginError">
                Email atau password salah. Silakan coba lagi.
            </div>
            
            <form id="loginForm">
                <div class="admin-form-group">
                    <label class="admin-form-label" for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="admin-form-input" 
                        placeholder="admin@amertaloka.com"
                        required
                    >
                </div>
                
                <div class="admin-form-group">
                    <label class="admin-form-label" for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="admin-form-input" 
                        placeholder="Masukkan password"
                        required
                    >
                </div>
                
                <button type="submit" class="admin-login-btn">
                    Masuk ke Dashboard
                </button>
            </form>
            
            <div class="admin-login-footer">
                <a href="../index.html">Kembali ke Beranda</a>
            </div>
            
            <div style="margin-top: 1.5rem; padding: 1rem; background: var(--color-gray-100); border-radius: 8px; font-size: 0.8125rem; color: var(--color-gray-600);">
                <strong>Demo Credentials:</strong><br>
                Email: admin@amertaloka.com<br>
                Password: admin123
            </div>
        </div>
    </div>
    
    <script>
        // Demo login credentials
        const DEMO_EMAIL = 'admin@amertaloka.com';
        const DEMO_PASSWORD = 'admin123';
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');
            
            if (email === DEMO_EMAIL && password === DEMO_PASSWORD) {
                // Store login state
                localStorage.setItem('amertaloka_admin_logged_in', 'true');
                localStorage.setItem('amertaloka_admin_user', JSON.stringify({
                    email: email,
                    name: 'Administrator',
                    role: 'admin'
                }));
                
                // Redirect to dashboard
                window.location.href = 'index.html';
            } else {
                errorEl.classList.add('show');
                setTimeout(() => {
                    errorEl.classList.remove('show');
                }, 3000);
            }
        });
        
        // Check if already logged in
        if (localStorage.getItem('amertaloka_admin_logged_in') === 'true') {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
